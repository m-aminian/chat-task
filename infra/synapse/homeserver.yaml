
server_name: "localhost"
public_baseurl: "http://localhost:8008/"
pid_file: /data/homeserver.pid
report_stats: false

listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    bind_addresses: ["0.0.0.0"]
    resources:
      - names: [client]
        compress: false

database:
  name: sqlite3
  args:
    database: /data/homeserver.db

log_config: "/config/log.config"
media_store_path: /data/media_store
signing_key_path: /data/localhost.signing.key

trusted_key_servers: []
suppress_key_server_warning: true

enable_registration: true
enable_registration_without_verification: true
registration_shared_secret: "assignment-shared-secret"
macaroon_secret_key: "assignment-macaroon-secret"
form_secret: "assignment-form-secret"

max_upload_size: 50M
enable_authenticated_media: false
dynamic_thumbnails: true
url_preview_enabled: false
presence:
  enabled: false
rc_message:
  per_second: 100000
  burst_count: 100000
rc_registration:
  per_second: 100000
  burst_count: 100000
rc_login:
  address:
    per_second: 100000
    burst_count: 100000
  account:
    per_second: 100000
    burst_count: 100000
  failed_attempts:
    per_second: 100000
    burst_count: 100000
rc_joins:
  local:
    per_second: 100000
    burst_count: 100000
  remote:
    per_second: 100000
    burst_count: 100000
rc_joins_per_room:
  per_second: 100000
  burst_count: 100000
rc_invites:
  per_room:
    per_second: 100000
    burst_count: 100000
  per_user:
    per_second: 100000
    burst_count: 100000
rc_admin_redaction:
  per_second: 100000
  burst_count: 100000
rc_media_create:
  per_second: 100000
  burst_count: 100000
